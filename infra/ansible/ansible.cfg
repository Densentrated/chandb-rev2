[defaults]
inventory = inventory.ini
host_key_checking = True
# The community.general.yaml callback was REMOVED in community.general 12.0.0.
# Readable output now comes from the built-in default callback instead.
callback_result_format = yaml
interpreter_python = /usr/bin/python3

[privilege_escalation]
become_ask_pass = True

[ssh_connection]
pipelining = True
