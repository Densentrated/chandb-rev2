---
# Host provisioning for the chandb-rev2 VPS (Ubuntu Server 24.04 LTS, noble).
# See docs/gitops-plan.md Phase 3 for the reasoning behind each block.
#
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook playbook.yml --check --diff
#   ansible-playbook playbook.yml --diff
#
# Prompts once for the admin user's sudo password (become_ask_pass in ansible.cfg).

- name: Provision chandb VPS
  hosts: vps
  become: true

  # NEEDRESTART_MODE=a is not optional on Ubuntu: needrestart ships enabled on
  # 24.04 and throws an interactive "restart which services?" prompt mid-apt,
  # which hangs the run with no useful output.
  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: a

  vars:
    ci_pubkey: "{{ lookup('file', '~/.ssh/chandb_ci.pub') }}"
    # Must match the USER in the Dockerfile. The portal and pipeline containers
    # run as this numeric UID, and bind mounts map by number, so host-side
    # ownership of /lake has to line up with it.
    portal_uid: 10001
    portal_gid: 10001

  tasks:
    # ------------------------------------------------------------------
    # Base packages
    # ------------------------------------------------------------------
    # acl is load-bearing: Ansible's become_user to an unprivileged account
    # (the admin user -> deploy) fails without it. ufw and unattended-upgrades
    # are preinstalled on Ubuntu Server; listing them keeps this valid against
    # a minimal image.
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - acl
          - ca-certificates
          - curl
          - fail2ban
          - gnupg
          - rsync
          - ufw
          - unattended-upgrades
        state: present
        update_cache: true

    # ------------------------------------------------------------------
    # Docker Engine
    # ------------------------------------------------------------------
    # Ubuntu's universe repo carries its own docker.io and docker-compose-v2
    # that conflict with Docker CE. Skipping this is the standard way to end up
    # with a `docker compose` that silently isn't the one you think it is.
    - name: Remove distro Docker packages
      ansible.builtin.apt:
        name:
          - containerd
          - docker-buildx
          - docker-compose
          - docker-compose-v2
          - docker-doc
          - docker.io
          - podman-docker
          - runc
        state: absent
        purge: true

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Fetch Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable Docker at boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # ------------------------------------------------------------------
    # Service accounts
    # ------------------------------------------------------------------
    # `portal` exists only so host-side ownership of /lake matches the UID the
    # containers run as. It never logs in.
    - name: Create portal group matching the container GID
      ansible.builtin.group:
        name: portal
        gid: "{{ portal_gid }}"
        system: true

    - name: Create portal user matching the container UID
      ansible.builtin.user:
        name: portal
        uid: "{{ portal_uid }}"
        group: portal
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    # CI's account. In the docker group so it can run compose; no sudo at all.
    - name: Create deploy user
      ansible.builtin.user:
        name: deploy
        shell: /bin/bash
        groups: docker
        append: true

    - name: Install CI public key for deploy
      ansible.posix.authorized_key:
        user: deploy
        key: "{{ ci_pubkey }}"
        state: present
        exclusive: true

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        # Compose manifests, rsynced by CI as the deploy user.
        - path: /opt/chandb
          owner: deploy
          group: deploy
          mode: "0755"
        # Written by CI (deploy), read by the portal container (gid 10001).
        # 0750 with group portal is what makes both halves work; 0700 would
        # lock the container out of its own secrets.
        - path: /opt/chandb/secrets
          owner: deploy
          group: portal
          mode: "0750"
        # Owned by the container UID: pipeline writes here, portal mounts :ro.
        - path: /lake
          owner: portal
          group: portal
          mode: "0755"

    # ------------------------------------------------------------------
    # sshd
    # ------------------------------------------------------------------
    # 00- prefix, not 99-: OpenSSH is first-match-wins and Ubuntu includes
    # sshd_config.d/* at the TOP of sshd_config, so the cloud image's
    # 50-cloud-init.conf (PasswordAuthentication yes) would otherwise win.
    - name: Harden sshd
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        mode: "0644"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes

    - name: Validate sshd config before touching the listener
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    # Ubuntu 24.04 socket-activates SSH, which makes reload semantics depend on
    # which setting changed. Opt out: run a resident sshd instead. Done as one
    # command so an aborted run can't leave nothing listening on 22.
    - name: Replace socket activation with a resident sshd
      ansible.builtin.shell: |
        set -e
        systemctl disable --now ssh.socket 2>/dev/null || true
        systemctl enable --now ssh.service
        systemctl restart ssh.service
      changed_when: true

    - name: Confirm something is listening on 22
      ansible.builtin.wait_for:
        port: 22
        host: 127.0.0.1
        timeout: 30

    # sshd -t only checks syntax; it exits 0 while password auth is still on.
    # Assert the EFFECTIVE config.
    - name: Assert effective sshd config
      ansible.builtin.command: /usr/sbin/sshd -T
      register: sshd_effective
      changed_when: false
      failed_when: >-
        'passwordauthentication no' not in sshd_effective.stdout_lines or
        'permitrootlogin no' not in sshd_effective.stdout_lines

    # ------------------------------------------------------------------
    # Firewall
    # ------------------------------------------------------------------
    # Allow 22 BEFORE enabling, or you drop your own session.
    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Default deny incoming
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Default allow outgoing
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    # ------------------------------------------------------------------
    # fail2ban / unattended-upgrades
    # ------------------------------------------------------------------
    - name: Enable fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    - name: Enable unattended-upgrades
      ansible.builtin.service:
        name: unattended-upgrades
        state: started
        enabled: true
