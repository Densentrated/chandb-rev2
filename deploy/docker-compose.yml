# Rsynced to /opt/chandb/ by .github/workflows/deploy.yml. Do not hand-edit on
# the VPS — the next deploy reverts it. See docs/gitops-plan.md Phase 4.
#
# There is deliberately no `ports:` key anywhere in this file. Nothing but
# cloudflared can reach the origin, which is what makes CF-Connecting-IP
# trustworthy for rate limiting.

services:
  portal:
    image: ${PORTAL_IMAGE}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    # Deliberately above DuckDB's 2GB limit so the OOM killer isn't the first
    # line of defense.
    mem_limit: 3g
    tmpfs:
      - /var/tmp/duckdb-spill:size=1g,uid=10001,mode=0700
    volumes:
      - /lake:/lake:ro
      - /opt/chandb/secrets:/run/secrets:ro
    environment:
      PORTAL_ADDR: ":8080"
    # Requires a -healthcheck flag on the binary: the image has no curl, the
    # container is read_only, and no port is published, so the host cannot
    # probe it from outside.
    healthcheck:
      test: ["CMD", "/usr/local/bin/portal", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [edge]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    # An env var is acceptable here. The architecture plan bans env-var secrets
    # because DuckDB can read_blob('/proc/self/environ') — that threat is scoped
    # to the portal container. cloudflared runs no untrusted queries and has a
    # separate environment. Portal secrets still go in /opt/chandb/secrets.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      portal:
        condition: service_healthy
    networks: [edge]

  # Long-lived ingest service. It owns its own schedule — nothing external
  # triggers it. For a one-off run (testing, backfill):
  #   docker compose run --rm pipeline -once
  pipeline:
    image: ${PORTAL_IMAGE}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/pipeline"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    environment:
      INGEST_INTERVAL: 30m
    tmpfs:
      - /tmp:size=64m,uid=10001,mode=0700
    volumes:
      # Read-write, unlike the portal. That asymmetry is the point.
      - /lake:/lake
      # Ingest API keys (e.g. 511_api_key) as files, never env vars. Readable
      # because the dir is deploy:portal 0750 and this runs as gid 10001.
      - /opt/chandb/secrets:/run/secrets:ro
    networks: [edge]

networks:
  edge:
