name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9

  # The browser tier. go test proves the server hands out bytes; this proves a
  # real browser turns those bytes into a page that renders and answers a
  # query. The engine is DuckDB-WASM running client-side, so everything worth
  # breaking breaks after the HTML arrives — see .claude/skills/verify/SKILL.md.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Exit 2 is INFRA_FAIL: the CDN serving the 34MB DuckDB-WASM bundle was
      # unreachable, the port was taken, chromium was missing. None of those
      # are a reason to block a merge, so they annotate instead of failing.
      # Exit 1 is a real regression and still fails the job.
      - name: Run the verify harness
        run: |
          rc=0; scripts/verify/run.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::verify was BLOCKED (infrastructure), not failed - see the uploaded artifacts"
            exit 0
          fi
          exit "$rc"
      # Artifacts are the point: a failure here is a screenshot and a console
      # log, not a line number. Upload them even when the run fails —-
      # especially then.
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verify-${{ github.run_id }}
          path: .verify/run-*/
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Every binary below is called by explicit path, never through PATH.
      #
      # The runner ships its own ansible-core in /opt/pipx_bin, which wins PATH
      # resolution over anything pipx installs for us. Collections then get
      # installed by one ansible-core while ansible-lint runs under another, and
      # the lint dies with:
      #   couldn't resolve module/action 'ansible.posix.authorized_key'
      #
      # One venv, one interpreter, explicit paths: ansible-galaxy and
      # ansible-lint are guaranteed to agree on where collections live.
      - name: Lint the playbook
        run: |
          python3 -m venv .lintenv
          ./.lintenv/bin/pip install --quiet --upgrade pip ansible-lint
          ./.lintenv/bin/ansible-galaxy collection install -r infra/ansible/requirements.yml
          ./.lintenv/bin/ansible-lint infra/ansible/playbook.yml

  # The single check to require in branch protection. Requiring this instead of
  # the individual jobs means adding or renaming a job never means editing the
  # ruleset.
  #
  # `if: always()` is load-bearing. Without it this job is SKIPPED when a
  # dependency fails, and GitHub counts a skipped required check as satisfied —
  # you would get a green merge button on a broken build.
  ci-ok:
    if: always()
    needs: [go, verify, image, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
